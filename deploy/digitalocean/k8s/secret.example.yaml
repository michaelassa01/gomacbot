# Create the live secret before first deploy (do not commit real values):
#
# kubectl create namespace gomacbot
# kubectl create secret generic gomacbot-env \
#   --namespace gomacbot \
#   --from-env-file=.env
#
apiVersion: v1
kind: Secret
metadata:
  name: gomacbot-env
  namespace: gomacbot
type: Opaque
stringData:
  DB_SOURCE: "postgres://user:password@host:5432/db?sslmode=require"
  SERVER_ADDRESS: "0.0.0.0:8080"
