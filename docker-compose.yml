services:
  postgres:
    image: postgres:17.4-alpine3.21
    container_name: macbot_postgres
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=macbot_db
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # redis:
  #   image: redis:7-alpine
  #   container_name: macbot_redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data

  api:
    container_name: macbot_api
    platform: linux/arm64
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://root:secret@postgres:5432/macbot_db?sslmode=disable
    env_file:
      - ./.env
    depends_on:
      - postgres
      # - redis
    entrypoint:
      [
        "/app/wait-for.sh",
        "postgres:5432",
        "--",
        # "/app/wait-for.sh",
        # "redis:6379",
        "--",
        "/app/start.sh",
      ]
    command: ["/app/main"]

volumes:
  postgres_data:
  redis_data:
